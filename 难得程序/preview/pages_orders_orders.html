<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=375,initial-scale=1" />
<title>我的预约</title>
<style>
html,body{margin:0;padding:0;width:375px;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;}
.pv-screen{width:375px;min-height:812px;position:relative;display:flex;flex-direction:column;background:#F6EFE3;}
.pv-statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;font-size:13px;font-weight:600;color:#2A241F;flex:none;}
.pv-nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;flex:none;background:#F6EFE3;}
.pv-nav__title{font-size:16px;font-weight:600;letter-spacing:1px;color:#2A241F;font-family:'Songti SC',serif;}
.pv-nav__back{position:absolute;left:14px;font-size:17px;color:#2A241F;}
.pv-nav__capsule{position:absolute;right:10px;width:76px;height:28px;border:1px solid rgba(42,36,31,.18);border-radius:14px;display:flex;align-items:center;justify-content:space-around;font-size:13px;color:#2A241F;background:rgba(255,255,255,.35);}
.pv-body{flex:1;overflow:auto;}
.pv-tabbar{height:54px;display:flex;align-items:center;border-top:1px solid #E0D2BA;flex:none;padding-bottom:6px;padding-top:4px;}
.pv-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.pv-tab img{width:22px;height:22px;}
.pv-tab span{font-size:10px;letter-spacing:.5px;}
img{display:block;}
input,textarea{border:none;background:transparent;outline:none;font-family:inherit;}
.wx-text{display:inline;}
a{text-decoration:none;color:inherit;}
/* ===========================================================
   难得民谣 · 全局样式（设计系统）
   风格关键词：牛皮纸 / 木头 / 暖灯 / 铅字印刷 / 票根
   =========================================================== */

.wxpage {
  --nd-paper: #F6EFE3;        /* 纸底 */
  --nd-card: #FDF9F0;         /* 卡片 */
  --nd-card-deep: #F0E5D2;    /* 次级底 */
  --nd-ink: #2A241F;          /* 墨色主文字 */
  --nd-ink-2: #6B6056;        /* 次级文字 */
  --nd-ink-3: #9C8B74;        /* 弱文字 */
  --nd-line: #E0D2BA;         /* 分割线 */
  --nd-amber: #C2743A;        /* 主色：威士忌 / 木吉他 */
  --nd-amber-deep: #A2562A;
  --nd-amber-soft: #F3E2CE;
  --nd-moss: #5F6B51;         /* 苔绿 */
  --nd-wine: #8C3B2E;         /* 酒红 */
  --nd-gold: #C9A227;
  --nd-night: #241E1A;        /* 夜色块 */

  background-color: var(--nd-paper);
  /* 纸张颗粒 */
  background-image:
    radial-gradient(rgba(122, 96, 58, 0.05) 1px, transparent 1px),
    radial-gradient(rgba(122, 96, 58, 0.035) 1px, transparent 1px);
  background-size: 7.00px 7.00px, 11.50px 11.50px;
  background-position: 0 0, 3.50px 5.50px;

  color: var(--nd-ink);
  font-size: 14.00px;
  line-height: 1.6;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
}

view, text, input, textarea, scroll-view, navigator, button, image {
  box-sizing: border-box;
}

/* ---------- 文字 ---------- */
.nd-serif {
  font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
}
.nd-h1 {
  font-family: 'Songti SC', 'STSong', 'SimSun', serif;
  font-size: 22.00px;
  font-weight: 700;
  letter-spacing: 2.00px;
  color: var(--nd-ink);
}
.nd-h2 {
  font-family: 'Songti SC', 'STSong', 'SimSun', serif;
  font-size: 17.00px;
  font-weight: 700;
  letter-spacing: 1.00px;
}
.nd-en {
  font-size: 10.00px;
  letter-spacing: 3.00px;
  color: var(--nd-ink-3);
  text-transform: uppercase;
}
.nd-muted { color: var(--nd-ink-2); }
.nd-weak { color: var(--nd-ink-3); }
.nd-amber { color: var(--nd-amber); }
.nd-wine { color: var(--nd-wine); }
.nd-sm { font-size: 12.00px; }
.nd-xs { font-size: 10.50px; }
.nd-bold { font-weight: 600; }

/* ---------- 布局 ---------- */
.nd-page {
  min-height: 100vh;
  padding: 0 14.00px 90.00px;
}
.nd-row { display: flex; align-items: center; }
.nd-row-between { display: flex; align-items: center; justify-content: space-between; }
.nd-col { display: flex; flex-direction: column; }
.nd-grow { flex: 1; min-width: 0; }
.nd-gap-s { height: 8.00px; }
.nd-gap { height: 14.00px; }
.nd-gap-l { height: 24.00px; }

/* ---------- 卡片 ---------- */
.nd-card {
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
  padding: 14.00px;
  box-shadow: 0 3.00px 0 rgba(42, 36, 31, 0.04);
}
.nd-card-flat {
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
}
.nd-card-night {
  background: var(--nd-night);
  border-radius: 5.00px;
  color: var(--nd-paper);
  padding: 14.00px;
}
.nd-card-night .nd-muted { color: #BFAE97; }

/* 章节标题：✦ 标题 ——————— */
.nd-section {
  display: flex;
  align-items: center;
  margin: 22.00px 0 11.00px;
}
.nd-section__mark {
  color: var(--nd-amber);
  font-size: 11.00px;
  margin-right: 6.00px;
}
.nd-section__title {
  font-family: 'Songti SC', 'STSong', 'SimSun', serif;
  font-size: 16.00px;
  font-weight: 700;
  letter-spacing: 1.50px;
}
.nd-section__line {
  flex: 1;
  height: 1.00px;
  margin-left: 10.00px;
  background-image: linear-gradient(to right, var(--nd-line) 60%, transparent 0);
  background-size: 6.00px 1.00px;
  background-repeat: repeat-x;
}
.nd-section__extra {
  font-size: 11.50px;
  color: var(--nd-ink-3);
  margin-left: 8.00px;
}

/* ---------- 票根 ---------- */
.nd-ticket {
  position: relative;
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
  overflow: hidden;
}
.nd-ticket__body { padding: 14.00px; }
/* 撕口虚线：左右两个圆缺口 */
.nd-perf {
  position: relative;
  height: 1.00px;
  margin: 0 15.00px;
  background-image: linear-gradient(to right, var(--nd-line) 55%, transparent 0);
  background-size: 7.00px 1.00px;
  background-repeat: repeat-x;
}
.nd-perf::before,
.nd-perf::after {
  content: '';
  position: absolute;
  top: -8.00px;
  width: 16.00px;
  height: 16.00px;
  border-radius: 50%;
  background: var(--nd-paper);
  border: 1.00px solid var(--nd-line);
}
.nd-perf::before { left: -23.00px; }
.nd-perf::after { right: -23.00px; }

/* ---------- 按钮 ---------- */
.nd-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 46.00px;
  border-radius: 4.00px;
  font-size: 15.00px;
  letter-spacing: 2.00px;
  font-weight: 600;
}
.nd-btn-main {
  background: var(--nd-amber);
  color: #FFF8EC;
  box-shadow: 0 3.00px 0 var(--nd-amber-deep);
}
.nd-btn-main:active { transform: translateY(1.50px); box-shadow: 0 1.50px 0 var(--nd-amber-deep); }
.nd-btn-ghost {
  background: transparent;
  color: var(--nd-ink);
  border: 1.00px solid var(--nd-ink);
}
.nd-btn-ghost:active { background: rgba(42, 36, 31, 0.06); }
.nd-btn-soft {
  background: var(--nd-amber-soft);
  color: var(--nd-amber-deep);
  border: 1.00px solid #E6CFB4;
}
.nd-btn-disabled {
  background: #DED3C2;
  color: #9C8B74;
  box-shadow: none;
}
.nd-btn-sm { height: 32.00px; font-size: 12.50px; padding: 0 14.00px; letter-spacing: 1.00px; }

/* ---------- 小标签 ---------- */
.nd-tag {
  display: inline-flex;
  align-items: center;
  height: 18.00px;
  padding: 0 6.00px;
  border-radius: 2.00px;
  font-size: 10.00px;
  letter-spacing: 0.50px;
  background: var(--nd-amber-soft);
  color: var(--nd-amber-deep);
  margin-right: 5.00px;
}
.nd-tag-moss { background: #E4E8DC; color: var(--nd-moss); }
.nd-tag-wine { background: #F2DED9; color: var(--nd-wine); }
.nd-tag-line { background: transparent; border: 1.00px solid var(--nd-line); color: var(--nd-ink-2); }

/* 状态印章 */
.nd-stamp {
  display: inline-flex;
  align-items: center;
  padding: 1.00px 7.00px;
  border: 1.50px solid var(--nd-amber);
  color: var(--nd-amber);
  border-radius: 3.00px;
  font-size: 11.00px;
  font-weight: 700;
  letter-spacing: 1.50px;
  transform: rotate(-6deg);
  opacity: 0.9;
}
.nd-stamp-moss { border-color: var(--nd-moss); color: var(--nd-moss); }
.nd-stamp-gray { border-color: #B9AB96; color: #B9AB96; }
.nd-stamp-wine { border-color: var(--nd-wine); color: var(--nd-wine); }

/* ---------- 图标 ---------- */
.nd-ic { width: 16.00px; height: 16.00px; flex: none; }
.nd-ic-s { width: 13.00px; height: 13.00px; flex: none; }
.nd-ic-l { width: 22.00px; height: 22.00px; flex: none; }

/* ---------- 列表行 ---------- */
.nd-cell {
  display: flex;
  align-items: center;
  padding: 14.00px 0;
  border-bottom: 1.00px solid var(--nd-line);
}
.nd-cell:last-child { border-bottom: none; }
.nd-cell__label { margin-left: 9.00px; flex: 1; }

/* ---------- 底部固定操作栏 ---------- */
.nd-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10.00px 14.00px calc(10.00px + constant(safe-area-inset-bottom));
  padding-bottom: calc(10.00px + env(safe-area-inset-bottom));
  background: rgba(251, 246, 236, 0.97);
  border-top: 1.00px solid var(--nd-line);
  display: flex;
  align-items: center;
  z-index: 50;
}

/* ---------- 空状态 ---------- */
.nd-empty {
  padding: 60.00px 0;
  text-align: center;
  color: var(--nd-ink-3);
}
.nd-empty__mark {
  font-family: 'Songti SC', serif;
  font-size: 28.00px;
  color: var(--nd-line);
  letter-spacing: 4.00px;
}

/* ---------- 页脚落款 ---------- */
.nd-foot {
  text-align: center;
  padding: 30.00px 0 10.00px;
  color: var(--nd-ink-3);
  font-size: 10.50px;
  letter-spacing: 1.50px;
}

.orders { padding-top: 10.00px; }

.tabs { display: flex; margin-bottom: 13.00px; }
.tab {
  margin-right: 20.00px;
  font-family: 'Songti SC', serif;
  font-size: 15.00px;
  letter-spacing: 1.50px;
  color: var(--nd-ink-3);
  padding-bottom: 4.00px;
  border-bottom: 2.00px solid transparent;
}
.tab.is-on { color: var(--nd-ink); font-weight: 700; border-bottom-color: var(--nd-amber); }
.tab__n { font-size: 10.50px; color: var(--nd-ink-3); margin-left: 2.00px; }

.row {
  display: flex;
  align-items: stretch;
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
  margin-bottom: 10.00px;
  padding: 12.00px 11.00px;
  box-shadow: 0 2.50px 0 rgba(42, 36, 31, 0.04);
}
.row__left { width: 59.00px; text-align: center; flex: none; display: flex; flex-direction: column; justify-content: center; }
.row__md {
  font-family: 'Songti SC', 'STSong', serif;
  font-size: 18.00px;
  font-weight: 700;
  line-height: 1.2;
}
.row__week { font-size: 10.00px; color: var(--nd-ink-3); }
.row__slot { font-size: 11.00px; color: var(--nd-amber-deep); margin-top: 3.00px; letter-spacing: 0.50px; }
.row__cut {
  width: 1.00px;
  margin: 0 11.00px;
  background-image: linear-gradient(to bottom, var(--nd-line) 55%, transparent 0);
  background-size: 1.00px 6.00px;
}
.row__main { flex: 1; min-width: 0; }
.row__line1 { display: flex; align-items: baseline; }
.row__table { font-size: 14.00px; font-weight: 600; letter-spacing: 0.50px; }
.row__people { font-size: 10.50px; color: var(--nd-ink-3); margin-left: 6.00px; }
.row__show {
  font-size: 11.00px;
  color: var(--nd-ink-2);
  margin-top: 3.00px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row__code { font-size: 10.00px; color: var(--nd-ink-3); margin-top: 3.00px; letter-spacing: 0.50px; }
.row__right { flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
.row__status {
  font-size: 10.00px;
  padding: 1.50px 6.00px;
  border-radius: 2.00px;
  border: 1.00px solid var(--nd-amber);
  color: var(--nd-amber);
  letter-spacing: 0.50px;
}
.row__status--confirmed { border-color: var(--nd-moss); color: var(--nd-moss); }
.row__status--seated { border-color: var(--nd-moss); color: var(--nd-moss); }
.row__status--cancelled { border-color: #B9AB96; color: #B9AB96; }
.row__status--done { border-color: #B9AB96; color: #B9AB96; }
.row__arrow { opacity: 0.5; }

.empty__t { font-size: 14.00px; color: var(--nd-ink-2); margin-top: 10.00px; letter-spacing: 1.00px; }
.empty__d { font-size: 11.00px; color: var(--nd-ink-3); margin-top: 4.00px; }
.empty__btn { display: inline-flex; margin-top: 18.00px; padding: 0 24.00px; height: 38.00px; }

</style></head>
<body>
<div class="pv-screen">
  <div class="pv-statusbar"><span>20:36</span><span>●●●　令　■</span></div>
  <div class="pv-nav">
    
    <span class="pv-nav__title">我的预约</span>
    <span class="pv-nav__capsule"><span>···</span><span>◉</span></span>
  </div>
  <div class="pv-body wxpage"><div class="wx-view nd-page orders"><div class="wx-view tabs"><div class="wx-view tab is-on">
      还没去 <span class="wx-text tab__n">2</span></div><div class="wx-view tab">
      去过的 <span class="wx-text tab__n">1</span></div></div><div class="wx-view"><div class="wx-view row"><div class="wx-view row__left"><div class="wx-view row__md">10.16</div><div class="wx-view row__week">周五</div><div class="wx-view row__slot">20:30</div></div><div class="wx-view row__cut"></div><div class="wx-view row__main"><div class="wx-view row__line1"><span class="wx-text row__table">中庭散台 B1</span><span class="wx-text row__people">2 位</span></div><div class="wx-view row__show">周五现场 · 巷口三人组</div><div class="wx-view row__code">取号 ND-1016-07</div></div><div class="wx-view row__right"><div class="wx-view row__status row__status--confirmed">已确认</div><img class="wx-image nd-ic-s row__arrow" src="assets/icons/ic-arrow.png" style="object-fit:fill;" alt="" /></div></div><div class="wx-view row"><div class="wx-view row__left"><div class="wx-view row__md">10.18</div><div class="wx-view row__week">周日</div><div class="wx-view row__slot">21:00</div></div><div class="wx-view row__cut"></div><div class="wx-view row__main"><div class="wx-view row__line1"><span class="wx-text row__table">临窗卡座 A4</span><span class="wx-text row__people">4 位</span></div><div class="wx-view row__show">黑胶之夜</div><div class="wx-view row__code">取号 ND-1018-03</div></div><div class="wx-view row__right"><div class="wx-view row__status row__status--pending">待确认</div><img class="wx-image nd-ic-s row__arrow" src="assets/icons/ic-arrow.png" style="object-fit:fill;" alt="" /></div></div></div><div class="wx-view nd-foot">所有预约都在这里了</div></div></div>
  <div class="pv-tabbar" style="background:#FBF6EC"><div class="pv-tab"><img src="assets/icons/tab-home.png" /><span style="color:#9C8B74">酒馆</span></div><div class="pv-tab"><img src="assets/icons/tab-show.png" /><span style="color:#9C8B74">演出</span></div><div class="pv-tab"><img src="assets/icons/tab-order-on.png" /><span style="color:#C2743A">我的预约</span></div><div class="pv-tab"><img src="assets/icons/tab-mine.png" /><span style="color:#9C8B74">我的</span></div></div>
</div>
</body></html>
