<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=375,initial-scale=1" />
<title>确认订座</title>
<style>
html,body{margin:0;padding:0;width:375px;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;}
.pv-screen{width:375px;min-height:812px;position:relative;display:flex;flex-direction:column;background:#F6EFE3;}
.pv-statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;font-size:13px;font-weight:600;color:#2A241F;flex:none;}
.pv-nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;flex:none;background:#F6EFE3;}
.pv-nav__title{font-size:16px;font-weight:600;letter-spacing:1px;color:#2A241F;font-family:'Songti SC',serif;}
.pv-nav__back{position:absolute;left:14px;font-size:17px;color:#2A241F;}
.pv-nav__capsule{position:absolute;right:10px;width:76px;height:28px;border:1px solid rgba(42,36,31,.18);border-radius:14px;display:flex;align-items:center;justify-content:space-around;font-size:13px;color:#2A241F;background:rgba(255,255,255,.35);}
.pv-body{flex:1;overflow:auto;}
.pv-tabbar{height:54px;display:flex;align-items:center;border-top:1px solid #E0D2BA;flex:none;padding-bottom:6px;padding-top:4px;}
.pv-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.pv-tab img{width:22px;height:22px;}
.pv-tab span{font-size:10px;letter-spacing:.5px;}
img{display:block;}
input,textarea{border:none;background:transparent;outline:none;font-family:inherit;}
.wx-text{display:inline;}
a{text-decoration:none;color:inherit;}
/* ===========================================================
   难得民谣 · 全局样式（设计系统）
   风格关键词：牛皮纸 / 木头 / 暖灯 / 铅字印刷 / 票根
   =========================================================== */

.wxpage {
  --nd-paper: #F6EFE3;        /* 纸底 */
  --nd-card: #FDF9F0;         /* 卡片 */
  --nd-card-deep: #F0E5D2;    /* 次级底 */
  --nd-ink: #2A241F;          /* 墨色主文字 */
  --nd-ink-2: #6B6056;        /* 次级文字 */
  --nd-ink-3: #9C8B74;        /* 弱文字 */
  --nd-line: #E0D2BA;         /* 分割线 */
  --nd-amber: #C2743A;        /* 主色：威士忌 / 木吉他 */
  --nd-amber-deep: #A2562A;
  --nd-amber-soft: #F3E2CE;
  --nd-moss: #5F6B51;         /* 苔绿 */
  --nd-wine: #8C3B2E;         /* 酒红 */
  --nd-gold: #C9A227;
  --nd-night: #241E1A;        /* 夜色块 */

  background-color: var(--nd-paper);
  /* 纸张颗粒 */
  background-image:
    radial-gradient(rgba(122, 96, 58, 0.05) 1px, transparent 1px),
    radial-gradient(rgba(122, 96, 58, 0.035) 1px, transparent 1px);
  background-size: 7.00px 7.00px, 11.50px 11.50px;
  background-position: 0 0, 3.50px 5.50px;

  color: var(--nd-ink);
  font-size: 14.00px;
  line-height: 1.6;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
}

view, text, input, textarea, scroll-view, navigator, button, image {
  box-sizing: border-box;
}

/* ---------- 文字 ---------- */
.nd-serif {
  font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
}
.nd-h1 {
  font-family: 'Songti SC', 'STSong', 'SimSun', serif;
  font-size: 22.00px;
  font-weight: 700;
  letter-spacing: 2.00px;
  color: var(--nd-ink);
}
.nd-h2 {
  font-family: 'Songti SC', 'STSong', 'SimSun', serif;
  font-size: 17.00px;
  font-weight: 700;
  letter-spacing: 1.00px;
}
.nd-en {
  font-size: 10.00px;
  letter-spacing: 3.00px;
  color: var(--nd-ink-3);
  text-transform: uppercase;
}
.nd-muted { color: var(--nd-ink-2); }
.nd-weak { color: var(--nd-ink-3); }
.nd-amber { color: var(--nd-amber); }
.nd-wine { color: var(--nd-wine); }
.nd-sm { font-size: 12.00px; }
.nd-xs { font-size: 10.50px; }
.nd-bold { font-weight: 600; }

/* ---------- 布局 ---------- */
.nd-page {
  min-height: 100vh;
  padding: 0 14.00px 90.00px;
}
.nd-row { display: flex; align-items: center; }
.nd-row-between { display: flex; align-items: center; justify-content: space-between; }
.nd-col { display: flex; flex-direction: column; }
.nd-grow { flex: 1; min-width: 0; }
.nd-gap-s { height: 8.00px; }
.nd-gap { height: 14.00px; }
.nd-gap-l { height: 24.00px; }

/* ---------- 卡片 ---------- */
.nd-card {
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
  padding: 14.00px;
  box-shadow: 0 3.00px 0 rgba(42, 36, 31, 0.04);
}
.nd-card-flat {
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
}
.nd-card-night {
  background: var(--nd-night);
  border-radius: 5.00px;
  color: var(--nd-paper);
  padding: 14.00px;
}
.nd-card-night .nd-muted { color: #BFAE97; }

/* 章节标题：✦ 标题 ——————— */
.nd-section {
  display: flex;
  align-items: center;
  margin: 22.00px 0 11.00px;
}
.nd-section__mark {
  color: var(--nd-amber);
  font-size: 11.00px;
  margin-right: 6.00px;
}
.nd-section__title {
  font-family: 'Songti SC', 'STSong', 'SimSun', serif;
  font-size: 16.00px;
  font-weight: 700;
  letter-spacing: 1.50px;
}
.nd-section__line {
  flex: 1;
  height: 1.00px;
  margin-left: 10.00px;
  background-image: linear-gradient(to right, var(--nd-line) 60%, transparent 0);
  background-size: 6.00px 1.00px;
  background-repeat: repeat-x;
}
.nd-section__extra {
  font-size: 11.50px;
  color: var(--nd-ink-3);
  margin-left: 8.00px;
}

/* ---------- 票根 ---------- */
.nd-ticket {
  position: relative;
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 5.00px;
  overflow: hidden;
}
.nd-ticket__body { padding: 14.00px; }
/* 撕口虚线：左右两个圆缺口 */
.nd-perf {
  position: relative;
  height: 1.00px;
  margin: 0 15.00px;
  background-image: linear-gradient(to right, var(--nd-line) 55%, transparent 0);
  background-size: 7.00px 1.00px;
  background-repeat: repeat-x;
}
.nd-perf::before,
.nd-perf::after {
  content: '';
  position: absolute;
  top: -8.00px;
  width: 16.00px;
  height: 16.00px;
  border-radius: 50%;
  background: var(--nd-paper);
  border: 1.00px solid var(--nd-line);
}
.nd-perf::before { left: -23.00px; }
.nd-perf::after { right: -23.00px; }

/* ---------- 按钮 ---------- */
.nd-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 46.00px;
  border-radius: 4.00px;
  font-size: 15.00px;
  letter-spacing: 2.00px;
  font-weight: 600;
}
.nd-btn-main {
  background: var(--nd-amber);
  color: #FFF8EC;
  box-shadow: 0 3.00px 0 var(--nd-amber-deep);
}
.nd-btn-main:active { transform: translateY(1.50px); box-shadow: 0 1.50px 0 var(--nd-amber-deep); }
.nd-btn-ghost {
  background: transparent;
  color: var(--nd-ink);
  border: 1.00px solid var(--nd-ink);
}
.nd-btn-ghost:active { background: rgba(42, 36, 31, 0.06); }
.nd-btn-soft {
  background: var(--nd-amber-soft);
  color: var(--nd-amber-deep);
  border: 1.00px solid #E6CFB4;
}
.nd-btn-disabled {
  background: #DED3C2;
  color: #9C8B74;
  box-shadow: none;
}
.nd-btn-sm { height: 32.00px; font-size: 12.50px; padding: 0 14.00px; letter-spacing: 1.00px; }

/* ---------- 小标签 ---------- */
.nd-tag {
  display: inline-flex;
  align-items: center;
  height: 18.00px;
  padding: 0 6.00px;
  border-radius: 2.00px;
  font-size: 10.00px;
  letter-spacing: 0.50px;
  background: var(--nd-amber-soft);
  color: var(--nd-amber-deep);
  margin-right: 5.00px;
}
.nd-tag-moss { background: #E4E8DC; color: var(--nd-moss); }
.nd-tag-wine { background: #F2DED9; color: var(--nd-wine); }
.nd-tag-line { background: transparent; border: 1.00px solid var(--nd-line); color: var(--nd-ink-2); }

/* 状态印章 */
.nd-stamp {
  display: inline-flex;
  align-items: center;
  padding: 1.00px 7.00px;
  border: 1.50px solid var(--nd-amber);
  color: var(--nd-amber);
  border-radius: 3.00px;
  font-size: 11.00px;
  font-weight: 700;
  letter-spacing: 1.50px;
  transform: rotate(-6deg);
  opacity: 0.9;
}
.nd-stamp-moss { border-color: var(--nd-moss); color: var(--nd-moss); }
.nd-stamp-gray { border-color: #B9AB96; color: #B9AB96; }
.nd-stamp-wine { border-color: var(--nd-wine); color: var(--nd-wine); }

/* ---------- 图标 ---------- */
.nd-ic { width: 16.00px; height: 16.00px; flex: none; }
.nd-ic-s { width: 13.00px; height: 13.00px; flex: none; }
.nd-ic-l { width: 22.00px; height: 22.00px; flex: none; }

/* ---------- 列表行 ---------- */
.nd-cell {
  display: flex;
  align-items: center;
  padding: 14.00px 0;
  border-bottom: 1.00px solid var(--nd-line);
}
.nd-cell:last-child { border-bottom: none; }
.nd-cell__label { margin-left: 9.00px; flex: 1; }

/* ---------- 底部固定操作栏 ---------- */
.nd-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10.00px 14.00px calc(10.00px + constant(safe-area-inset-bottom));
  padding-bottom: calc(10.00px + env(safe-area-inset-bottom));
  background: rgba(251, 246, 236, 0.97);
  border-top: 1.00px solid var(--nd-line);
  display: flex;
  align-items: center;
  z-index: 50;
}

/* ---------- 空状态 ---------- */
.nd-empty {
  padding: 60.00px 0;
  text-align: center;
  color: var(--nd-ink-3);
}
.nd-empty__mark {
  font-family: 'Songti SC', serif;
  font-size: 28.00px;
  color: var(--nd-line);
  letter-spacing: 4.00px;
}

/* ---------- 页脚落款 ---------- */
.nd-foot {
  text-align: center;
  padding: 30.00px 0 10.00px;
  color: var(--nd-ink-3);
  font-size: 10.50px;
  letter-spacing: 1.50px;
}

.confirm { padding-top: 12.00px; }

/* 票根摘要 */
.stub { box-shadow: 0 3.00px 0 rgba(42, 36, 31, 0.05); }
.stub__top { display: flex; align-items: center; justify-content: space-between; padding: 15.00px 16.00px 13.00px; }
.stub__date {
  font-family: 'Songti SC', 'STSong', serif;
  font-size: 19.00px;
  font-weight: 700;
  letter-spacing: 1.00px;
}
.stub__slot { font-size: 12.00px; color: var(--nd-ink-2); margin-top: 2.00px; letter-spacing: 1.00px; }
.stub__right { text-align: right; }
.stub__table {
  font-family: 'Songti SC', serif;
  font-size: 19.00px;
  font-weight: 700;
  color: var(--nd-amber-deep);
  letter-spacing: 1.00px;
}
.stub__zone { font-size: 11.00px; color: var(--nd-ink-3); margin-top: 2.00px; }
.stub__bottom { display: flex; padding: 12.00px 16.00px 14.00px; }
.stub__item { flex: 1; }
.stub__k { display: block; font-size: 10.00px; color: var(--nd-ink-3); letter-spacing: 0.50px; }
.stub__v { display: block; font-size: 13.00px; margin-top: 2.00px; font-weight: 600; }

/* 表单 */
.form { padding: 2.00px 14.00px; }
.field { display: flex; align-items: center; padding: 13.00px 0; border-bottom: 1.00px solid var(--nd-line); }
.field:last-child { border-bottom: none; }
.field__label { width: 75.00px; font-size: 13.00px; color: var(--nd-ink-2); letter-spacing: 1.00px; flex: none; }
.field__input { flex: 1; font-size: 14.00px; color: var(--nd-ink); }
.field__ph { color: #BCAD97; font-size: 12.00px; }

/* 标签 */
.tags { display: flex; flex-wrap: wrap; margin-bottom: 10.00px; }
.tagpick {
  padding: 5.00px 12.00px;
  margin: 0 7.00px 7.00px 0;
  font-size: 11.50px;
  color: var(--nd-ink-2);
  background: var(--nd-card);
  border: 1.00px solid var(--nd-line);
  border-radius: 20.00px;
}
.tagpick.is-on {
  background: var(--nd-amber-soft);
  border-color: var(--nd-amber);
  color: var(--nd-amber-deep);
  font-weight: 600;
}

.remark { width: 100%; min-height: 65.00px; font-size: 13.00px; line-height: 1.7; }

/* 须知 */
.rules {
  margin-top: 17.00px;
  padding: 13.00px 14.00px;
  border: 1.00px dashed var(--nd-line);
  border-radius: 5.00px;
}
.rules__title {
  font-family: 'Songti SC', serif;
  font-size: 12.50px;
  letter-spacing: 2.00px;
  color: var(--nd-ink-2);
  margin-bottom: 5.00px;
}
.rules__item { display: flex; margin-top: 4.00px; }
.rules__dot { color: var(--nd-amber); margin-right: 6.00px; font-size: 10.50px; }
.rules__text { flex: 1; font-size: 10.50px; color: var(--nd-ink-3); line-height: 1.7; }

/* 底栏 */
.barinfo { flex: 1; min-width: 0; }
.barinfo__l1 { font-size: 10.50px; color: var(--nd-ink-3); }
.barinfo__l2 { font-size: 12.00px; margin-top: 1.00px; }
.barbtn { width: 120.00px; flex: none; }

</style></head>
<body>
<div class="pv-screen">
  <div class="pv-statusbar"><span>20:36</span><span>●●●　令　■</span></div>
  <div class="pv-nav">
    <span class="pv-nav__back">‹</span>
    <span class="pv-nav__title">确认订座</span>
    <span class="pv-nav__capsule"><span>···</span><span>◉</span></span>
  </div>
  <div class="pv-body wxpage"><div class="wx-view nd-page confirm"><div class="wx-view nd-ticket stub"><div class="wx-view stub__top"><div class="wx-view stub__left"><div class="wx-view stub__date">10月16日 周五</div><div class="wx-view stub__slot">20:30</div></div><div class="wx-view stub__right"><div class="wx-view stub__table">B3</div><div class="wx-view stub__zone">中庭散台</div></div></div><div class="wx-view nd-perf"></div><div class="wx-view stub__bottom"><div class="wx-view stub__item"><span class="wx-text stub__k">人数</span><span class="wx-text stub__v">2 位</span></div><div class="wx-view stub__item"><span class="wx-text stub__k">最低消费</span><span class="wx-text stub__v">¥188</span></div><div class="wx-view stub__item"><span class="wx-text stub__k">今晚</span><span class="wx-text stub__v">周五现场</span></div></div></div><div class="wx-view nd-section"><span class="wx-text nd-section__mark">✦</span><span class="wx-text nd-section__title">留个称呼</span><div class="wx-view nd-section__line"></div></div><div class="wx-view nd-card form"><div class="wx-view field"><span class="wx-text field__label">怎么称呼</span><input class="wx-input field__input" value="小周" placeholder="比如：李先生 / 小周" /></div><div class="wx-view field"><span class="wx-text field__label">手机号</span><input class="wx-input field__input" value="13812345678" placeholder="到店前我们可能会联系你" /></div></div><div class="wx-view nd-section"><span class="wx-text nd-section__mark">✦</span><span class="wx-text nd-section__title">想说点什么</span><div class="wx-view nd-section__line"></div><span class="wx-text nd-section__extra">可不填</span></div><div class="wx-view tags"><div class="wx-view tagpick">过生日</div><div class="wx-view tagpick">想点歌</div><div class="wx-view tagpick">要安静角落</div><div class="wx-view tagpick">靠窗</div><div class="wx-view tagpick">朋友聚会</div><div class="wx-view tagpick">第一次来</div><div class="wx-view tagpick">会晚到一点</div></div><div class="wx-view nd-card"><textarea class="wx-textarea remark" placeholder="比如：想坐安静一点的角落 / 朋友过生日，能不能帮忙唱一首"></textarea></div><div class="wx-view rules"><div class="wx-view rules__title">订座须知</div><div class="wx-view rules__item"><span class="wx-text rules__dot">—</span><span class="wx-text rules__text">桌位为您保留 15 分钟，晚到请提前来个电话</span></div><div class="wx-view rules__item"><span class="wx-text rules__dot">—</span><span class="wx-text rules__text">每桌有最低消费，演出日周末低消会高一些</span></div><div class="wx-view rules__item"><span class="wx-text rules__dot">—</span><span class="wx-text rules__text">演出进行时请把说话声音放轻，台上的人会听见</span></div><div class="wx-view rules__item"><span class="wx-text rules__dot">—</span><span class="wx-text rules__text">可以带朋友、带故事、带吉他，不要带外带酒水</span></div></div><div class="wx-view nd-foot">提交后店里会尽快确认，通常十分钟内</div></div><div class="wx-view nd-bar"><div class="wx-view barinfo"><div class="wx-view barinfo__l1">10月16日 周五 20:30</div><div class="wx-view barinfo__l2">中庭散台 B3 · 2 位</div></div><div class="wx-view nd-btn nd-btn-main barbtn">确认订座</div></div></div>
  
</div>
</body></html>
